<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TokenWatch">
<meta name="theme-color" content="#0D0F12">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>TokenWatch</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
:root{
  --bg:#0D0F12;--s1:#141820;--s2:#1C2230;
  --border:#252D3D;--border2:#2E3A50;
  --cyan:#00D4FF;--cyan-d:rgba(0,212,255,.12);--cyan-b:rgba(0,212,255,.25);
  --green:#00C896;--green-d:rgba(0,200,150,.12);
  --amber:#FFB800;--amber-d:rgba(255,184,0,.12);
  --red:#FF4D4D;--red-d:rgba(255,77,77,.12);
  --t1:#E8EDF5;--t2:#8A9BB5;--t3:#4A5A72;
  --mono:'SF Mono','Courier New',monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --st:env(safe-area-inset-top,0px);
  --sb:env(safe-area-inset-bottom,0px);
  --sl:env(safe-area-inset-left,0px);
  --sr:env(safe-area-inset-right,0px);
}
body{background:var(--bg);color:var(--t1);font-family:var(--sans)}
.sbar{background:var(--s1);height:var(--st);position:fixed;top:0;left:0;right:0;z-index:200}
.topbar{
  background:var(--s1);border-bottom:.5px solid var(--border);
  padding:12px 16px 10px;display:flex;align-items:center;gap:10px;
  position:fixed;top:var(--st);left:0;right:0;z-index:100;
  padding-left:calc(16px + var(--sl));padding-right:calc(16px + var(--sr));
}
.logo{width:30px;height:30px;border-radius:8px;background:var(--cyan-d);border:1px solid var(--cyan-b);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;font-weight:700;color:var(--cyan);flex-shrink:0}
.title-wrap{flex:1}
.app-title{font-size:15px;font-weight:600;color:var(--t1)}
.app-sub{font-size:11px;color:var(--t3);font-family:var(--mono);margin-top:1px}
.topbar-r{text-align:right;flex-shrink:0}
.ts{font-size:11px;color:var(--t3);font-family:var(--mono)}
.st{font-size:10px;margin-top:2px;font-family:var(--mono)}
.st.live{color:var(--green)}.st.stale{color:var(--amber)}.st.err{color:var(--red)}
.pb-wrap{position:fixed;top:calc(var(--st) + 52px);left:0;right:0;height:2px;z-index:101}
.pb{height:100%;background:var(--cyan);width:0%;transition:width .3s ease}
.ticker{
  position:fixed;top:calc(var(--st) + 54px);left:0;right:0;
  background:var(--s1);border-bottom:.5px solid var(--border);
  padding:6px 16px;display:flex;gap:6px;align-items:center;
  overflow-x:auto;scrollbar-width:none;z-index:99;min-height:34px;
  padding-left:calc(16px + var(--sl));
}
.ticker::-webkit-scrollbar{display:none}
.tlbl{font-size:10px;font-family:var(--mono);color:var(--t3);letter-spacing:.07em;text-transform:uppercase;flex-shrink:0;margin-right:2px}
.chip{font-size:11px;font-weight:600;font-family:var(--mono);padding:3px 9px;border-radius:100px;border:1px solid;white-space:nowrap;flex-shrink:0;background:var(--cyan-d);border-color:var(--cyan);color:var(--cyan)}
.chip-empty{font-size:11px;color:var(--t3);font-family:var(--mono);font-style:italic}
.scroll{
  position:fixed;top:calc(var(--st) + 88px);
  bottom:0;left:0;right:0;
  overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:12px 14px calc(80px + var(--sb));
  padding-left:calc(14px + var(--sl));padding-right:calc(14px + var(--sr));
}
.card{background:var(--s1);border:.5px solid var(--border);border-radius:14px;margin-bottom:10px;overflow:hidden;transition:border-color .2s}
.card.live{border-color:var(--border2)}
.ch{padding:11px 13px 9px;display:flex;align-items:center;gap:10px;border-bottom:.5px solid var(--border)}
.tlogo{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:10px;font-weight:700;border:1.5px solid;flex-shrink:0}
.tmeta{flex:1;min-width:0}
.tsym{font-size:14px;font-weight:600;color:var(--t1)}
.tname{font-size:11px;color:var(--t3);font-family:var(--mono);margin-top:1px}
.cnt{font-size:11px;font-family:var(--mono);font-weight:700;padding:2px 8px;border-radius:100px;border:1px solid;flex-shrink:0}
.cb{padding:10px 13px}
.nr{border-bottom:.5px solid var(--border);padding:9px 0}
.nr:last-child{border-bottom:none;padding-bottom:0}
.nr:first-child{padding-top:0}
.nm{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.src{font-size:10px;font-family:var(--mono);font-weight:600;padding:1px 6px;border-radius:3px;letter-spacing:.04em}
.s-cd{background:#1a2236;color:#7EB8F7;border:1px solid #2A4A7A}
.s-ct{background:#1a1a24;color:#A78BFA;border:1px solid #4A3A7A}
.s-dc{background:#1a2218;color:#6ED89A;border:1px solid #2A6A40}
.s-tb{background:#1a1f2e;color:#60A5FA;border:1px solid #1E40AF}
.s-bc{background:#1f1a2e;color:#C084FC;border:1px solid #7C3AED}
.s-bw{background:#2e1a1a;color:#FCA5A5;border:1px solid #DC2626}
.nage{font-size:10px;color:var(--t3);font-family:var(--mono)}
.ntitle{font-size:13px;color:var(--t2);line-height:1.45}
.ntitle a{color:inherit;text-decoration:none}
.ntitle a:active{color:var(--t1)}
.empty{font-size:12px;color:var(--t3);font-family:var(--mono);padding:6px 0;font-style:italic}
.loading{font-size:12px;color:var(--t3);font-family:var(--mono);padding:6px 0;animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
/* FAB — large touch target */
.fab{
  position:fixed;
  bottom:calc(24px + var(--sb));
  right:calc(20px + var(--sr));
  z-index:999;
  width:60px;height:60px;border-radius:50%;
  background:var(--cyan);border:none;color:#0D0F12;
  font-size:26px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 24px rgba(0,212,255,.5);
  cursor:pointer;
  -webkit-appearance:none;
  touch-action:manipulation;
}
.fab:active{opacity:.8}
.fab:disabled{opacity:.4}
.spin{animation:spin .65s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.hint{position:fixed;bottom:calc(100px + var(--sb));left:calc(14px + var(--sl));right:calc(14px + var(--sr));background:var(--s2);border:1px solid var(--cyan-b);border-radius:12px;padding:12px 14px;z-index:120;display:none}
.hint.show{display:block}
.ht{font-size:13px;font-weight:600;color:var(--t1);margin-bottom:4px}
.hb{font-size:12px;color:var(--t2);line-height:1.7}
.hb strong{color:var(--cyan)}
.hx{position:absolute;top:10px;right:12px;background:none;border:none;color:var(--t3);font-size:18px;cursor:pointer;padding:0;line-height:1}
</style>
</head>
<body>

<div class="sbar"></div>
<div class="topbar">
  <div class="logo">TW</div>
  <div class="title-wrap">
    <div class="app-title">TokenWatch</div>
    <div class="app-sub" id="sub">9 tokens</div>
  </div>
  <div class="topbar-r">
    <div class="ts" id="ts">—</div>
    <div class="st" id="st">Ready</div>
  </div>
</div>

<div class="pb-wrap"><div class="pb" id="pb"></div></div>

<div class="ticker" id="ticker">
  <span class="tlbl">News</span>
  <span class="chip-empty">Tap ↻ to load</span>
</div>

<div class="scroll" id="cards"></div>

<button class="fab" id="fab" onclick="go()">
  <span id="fi">↻</span>
</button>

<div class="hint" id="hint">
  <button class="hx" onclick="this.parentElement.classList.remove('show')">×</button>
  <div class="ht">Add to Home Screen</div>
  <div class="hb">Tap <strong>Share ↑</strong> in Safari<br>then <strong>Add to Home Screen</strong></div>
</div>

<script>
const FN = '/.netlify/functions/feed';

const FEEDS = [
  {n:'CoinDesk',      cls:'s-cd', url:'https://www.coindesk.com/arc/outboundfeeds/rss/'},
  {n:'CoinTelegraph', cls:'s-ct', url:'https://cointelegraph.com/rss'},
  {n:'Decrypt',       cls:'s-dc', url:'https://decrypt.co/feed'},
  {n:'The Block',     cls:'s-tb', url:'https://www.theblock.co/rss.xml'},
  {n:'BeInCrypto',   cls:'s-bc', url:'https://beincrypto.com/feed/'},
  {n:'Blockworks',   cls:'s-bw', url:'https://blockworks.co/feed'},
];

// Very broad keywords — single word matches, no spaces required
const TOKENS = [
  {s:'ETH',  n:'Ethereum',      c:'#627EEA', b:'#627EEA22', kw:['ethereum','ether','vitalik','glamsterdam','eip','beacon']},
  {s:'SOL',  n:'Solana',        c:'#9945FF', b:'#9945FF22', kw:['solana','firedancer','alpenglow']},
  {s:'HYPE', n:'Hyperliquid',   c:'#00A88F', b:'#00C2A822', kw:['hyperliquid','hyper liquid']},
  {s:'LINK', n:'Chainlink',     c:'#375BD2', b:'#375BD222', kw:['chainlink','ccip']},
  {s:'TRX',  n:'Tron',          c:'#CC0000', b:'#FF060622', kw:['tron','justin sun','trx']},
  {s:'NEAR', n:'NEAR Protocol', c:'#00B572', b:'#00EC9722', kw:['near protocol','near foundation']},
  {s:'ZRO',  n:'LayerZero',     c:'#7B61FF', b:'#7B61FF22', kw:['layerzero','layer zero','zro']},
  {s:'TAO',  n:'Bittensor',     c:'#7ecfff', b:'#1C2A3A',   kw:['bittensor','dtao']},
  {s:'ZEC',  n:'Zcash',         c:'#C99A00', b:'#F4B72822', kw:['zcash','zcsh']},
];

// Cache — 25 min
const CK='tw_v7';
function save(d){try{localStorage.setItem(CK,JSON.stringify({t:Date.now(),d}));}catch(e){}}
function load(){
  try{const r=JSON.parse(localStorage.getItem(CK)||'null');if(r&&Date.now()-r.t<25*60*1000)return r.d;}catch(e){}
  return null;
}

function ageStr(d){
  if(!d)return '';
  const s=(Date.now()-new Date(d).getTime())/1000;
  if(isNaN(s)||s<0)return '';
  if(s<3600)return `${Math.round(s/60)}m ago`;
  if(s<86400)return `${Math.round(s/3600)}h ago`;
  return `${Math.round(s/86400)}d ago`;
}

function matches(title, tok){
  const t = title.toLowerCase();
  return tok.kw.some(k => t.includes(k.toLowerCase()));
}

function setPb(p){document.getElementById('pb').style.width=p+'%';}
function setSt(txt,cls){const e=document.getElementById('st');e.textContent=txt;e.className='st '+(cls||'');}
function setTs(){document.getElementById('ts').textContent=new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});}

function buildCards(){
  const el=document.getElementById('cards');
  el.innerHTML='';
  TOKENS.forEach(t=>{
    el.innerHTML+=`
    <div class="card" id="c-${t.s}">
      <div class="ch">
        <div class="tlogo" style="color:${t.c};background:${t.b};border-color:${t.c}">${t.s}</div>
        <div class="tmeta"><div class="tsym">${t.s}</div><div class="tname">${t.n}</div></div>
        <div class="cnt" id="cnt-${t.s}" style="color:${t.c};border-color:${t.c};background:${t.b}">…</div>
      </div>
      <div class="cb" id="b-${t.s}"><div class="loading">Loading…</div></div>
    </div>`;
  });
}

function paintCard(sym, arts){
  const body=document.getElementById('b-'+sym);
  const cnt=document.getElementById('cnt-'+sym);
  const card=document.getElementById('c-'+sym);
  if(!arts||!arts.length){
    cnt.textContent='0';
    body.innerHTML='<div class="empty">No headlines this week</div>';
    return;
  }
  card.classList.add('live');
  cnt.textContent=arts.length;
  body.innerHTML=arts.slice(0,5).map(a=>`
    <div class="nr">
      <div class="nm">
        <span class="src ${a.cls}">${a.src}</span>
        <span class="nage">${ageStr(a.pubDate)}</span>
      </div>
      <div class="ntitle"><a href="${a.link}" target="_blank" rel="noopener">${a.title}</a></div>
    </div>`).join('');
}

function paintTicker(map){
  const el=document.getElementById('ticker');
  const active=TOKENS.filter(t=>(map[t.s]||[]).length>0);
  if(!active.length){
    el.innerHTML='<span class="tlbl">News</span><span class="chip-empty">No matches — try later</span>';
    return;
  }
  let h='<span class="tlbl">News</span>';
  active.forEach(t=>h+=`<span class="chip">${t.s} · ${(map[t.s]||[]).length}</span>`);
  el.innerHTML=h;
}

let running=false;

async function go(){
  if(running)return;
  running=true;
  // Clear cache so we always get fresh data
  try{localStorage.removeItem(CK);}catch(e){}

  const fab=document.getElementById('fab'),fi=document.getElementById('fi');
  fab.disabled=true;
  fi.innerHTML='<span class="spin">↻</span>';
  setSt('Fetching…','');
  buildCards();
  setPb(5);

  let allArticles=[];
  let successCount=0;

  for(let i=0;i<FEEDS.length;i++){
    const feed=FEEDS[i];
    setPb(10+Math.round((i/FEEDS.length)*70));
    try{
      const res=await fetch(`${FN}?url=${encodeURIComponent(feed.url)}`,{
        signal: (() => { const c = new AbortController(); setTimeout(() => c.abort(), 15000); return c.signal; })()
      });
      if(res.ok){
        const j=await res.json();
        const items=(j.items||[]).map(item=>({...item,src:feed.n,cls:feed.cls}));
        allArticles.push(...items);
        successCount++;
      }
    }catch(e){
      console.warn('Feed failed:',feed.n,e.message);
    }
  }

  setPb(85);

  // No date filtering — show ALL articles, most recent first
  allArticles.sort((a,b)=>new Date(b.pubDate||0)-new Date(a.pubDate||0));

  const map={};
  TOKENS.forEach(t=>{
    const seen=new Set();
    map[t.s]=allArticles.filter(a=>{
      if(!matches(a.title||'',t))return false;
      const k=(a.title||'').slice(0,60).toLowerCase();
      if(seen.has(k))return false;
      seen.add(k);
      return true;
    });
  });

  setPb(95);
  TOKENS.forEach(t=>paintCard(t.s,map[t.s]));
  paintTicker(map);

  const total=Object.values(map).reduce((s,a)=>s+a.length,0);
  document.getElementById('sub').textContent=
    successCount>0
      ? `9 tokens · ${total} headlines · ${successCount}/${FEEDS.length} feeds`
      : '9 tokens · all feeds failed';

  save(map);
  setTs();
  setPb(100);
  setSt(total>0?'Live ✓':'No matches','live');
  setTimeout(()=>setPb(0),800);

  fab.disabled=false;
  fi.textContent='↻';
  running=false;
}

function renderCached(d){
  buildCards();
  TOKENS.forEach(t=>paintCard(t.s,d[t.s]||[]));
  paintTicker(d);
  const total=Object.values(d).reduce((s,a)=>s+a.length,0);
  document.getElementById('sub').textContent=`9 tokens · ${total} cached`;
  setTs();
  setSt('Cached · tap ↻','stale');
}

window.addEventListener('load',()=>{
  if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
  const standalone=window.navigator.standalone||window.matchMedia('(display-mode:standalone)').matches;
  if(!standalone)setTimeout(()=>document.getElementById('hint').classList.add('show'),3000);
  // Always fetch fresh on load — don't use cache
  go();
});
</script>
</body>
</html>
